services:
  - name: hestia-api-dev-620b
    host: wmcysndevds.icm.gov.bc.ca
    path: /api/v1/portal/getListOfEntity
    tags: [ ns.bcicm.hestia ]
    plugins:
      - name: request-transformer
        enabled: true
        protocols: [http, https]
        tags: [ ns.bcicm.hestia ]
        config: 
          remove:
            headers:
              - Cookie
      - name: acl
        enabled: true
        tags: [ ns.bcicm.hestia ]
        config:
          allow:
            - BCCW-ACCESS
          deny: null
          hide_groups_header: false
      - name: oidc
        enabled: true
        tags: [ ns.bcicm.hestia ]
        config:
          access_token_as_bearer: "no"
          access_token_header_name: Authorization
          bearer_jwt_auth_allowed_auds:
            - mcfd-mobility-4577
          bearer_jwt_auth_enable: "no"
          bearer_jwt_auth_signing_algs:
            - RS256
          bearer_only: "yes"
          client_id: mcfd-mobility-4577
          client_secret: ""
          disable_access_token_header: "yes"
          disable_id_token_header: "yes"
          disable_userinfo_header: "yes"
          discovery: https://dev.loginproxy.gov.bc.ca/auth/realms/standard/.well-known/openid-configuration
          filters: null
          groups_claim: client_roles
          header_claims: [ idir_username, email ]
          header_names: [ X-Idir-Username, X-User-Email ]
          id_token_header_name: X-ID-Token
          ignore_auth_filters: ""
          introspection_cache_ignore: "no"
          introspection_endpoint: https://dev.loginproxy.gov.bc.ca/auth/realms/standard/protocol/openid-connect/token/introspect
          introspection_endpoint_auth_method: client_secret_basic
          logout_path: https://dev.loginproxy.gov.bc.ca/auth/realms/standard/protocol/openid-connect/logout
          realm: standard
          recovery_page_path: null
          redirect_after_logout_uri: /
          redirect_uri: null
          response_type: code
          revoke_tokens_on_logout: "yes"
          scope: profile
          session_secret: null
          skip_already_auth_requests: "no"
          ssl_verify: "no"
          timeout: null
          token_endpoint_auth_method: client_secret_post
          unauth_action: auth
          use_jwks: "yes"
          userinfo_header_name: X-USERINFO
          validate_scope: "yes"
    port: 443
    protocol: https
    retries: 0
    routes:
      - name: hestia-api-dev-620b-route
        tags: [ ns.bcicm.hestia ]
        hosts:
          - hestia-dev.api.gov.bc.ca
        paths:
          - /v1/caseload
        methods:
          - POST
        strip_path: true
        https_redirect_status_code: 426
        path_handling: v0
