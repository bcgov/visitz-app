version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/visitz/**/*"
    schedule:
      interval: "daily"
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    ignore:
      - dependency-type: "direct"
        update-types: ["version-update:semver-patch", "patch"]
      - dependency-type: "indirect"
        update-types: ["version-update:semver-patch", "patch"]
