name: Run .NET MAUI tests

run-name: Run .NET MAUI tests (${{ github.ref_name }})

on:
  workflow_dispatch:
  push:
    paths:
      - visitz/**/*

permissions:
  contents: read
  actions: read
  checks: write

env:
  BASE_PROJPATH: "./visitz"
  DOTNET_SDK_VERSION: "8.0.404"
  GLOBAL_JSON_PATH: "visitz/global.json"

jobs:
  run-maui-tests:
    name: Build and test .NET MAUI project
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      TEST_RESULTS: "testResults"
    steps:
      - uses: actions/checkout@v4.1.7

      - name: Inflate ${{ env.GLOBAL_JSON_PATH }}
        run: |
          Copy-Item .\${{ env.GLOBAL_JSON_PATH }}.template .\${{ env.GLOBAL_JSON_PATH }}

      - name: Force .NET SDK version ${{ env.DOTNET_SDK_VERSION }}
        uses: jossef/action-set-json-field@v2.2
        with:
          file: ${{ env.GLOBAL_JSON_PATH }}
          field: sdk.version
          value: ${{ env.DOTNET_SDK_VERSION }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4.0.1
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Prepare NuGet
        run: |
          dotnet --version
          dotnet nuget locals all --clear

      - name: Cache .NET dependencies
        uses: actions/cache@v4.0.2
        if: always()
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install .NET MAUI workload
        working-directory: ${{ env.BASE_PROJPATH }}
        run: |
          dotnet --version
          dotnet workload install maui ios maccatalyst maui-ios maui-windows

      - name: Build solution
        working-directory: ${{ env.BASE_PROJPATH }}
        run: |
          dotnet --version
          dotnet build --framework net8.0

      # Running with --no-build to work around an MSBuild targets issue.
      # (Details: build throws an error about a missing "Visitz.appSettings.json" file. That file should only exist
      # when running a build in Release mode.)
      - name: Run tests
        working-directory: ${{ env.BASE_PROJPATH }}
        run: |
          dotnet --version
          dotnet test `
            --framework net8.0 `
            --logger "trx;LogFilePrefix=${{ env.TEST_RESULTS }}" `
            --no-build

      - name: Report tests
        uses: dorny/test-reporter@v1.8.0
        if: success() || failure()
        with:
          name: Visitz MAUI Tests
          path: "**/${{ env.TEST_RESULTS }}*.trx"
          reporter: dotnet-trx
