name: Build iOS release package

run-name: Build iOS release package (${{ github.event.inputs.environment }})

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to build package for'
        type: environment
        required: true

env:
  PROJPATH: "visitz/Visitz"
      
jobs:

  build-ios-package:
    name: Building, archiving and uploading IPA to GitHub
    runs-on: macOS-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 200
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Import code-signing certificates
        uses: Apple-Actions/import-codesign-certs@v1
        with: 
          p12-file-base64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.IOS_BUILD_CERTIFICATE_PASSWORD }}

      - name: Install provisioning profile
        env:
          IOS_BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision

          echo -n "$IOS_BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          # apply provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles
      
      - name: Cache .NET and MAUI workloads
        id: cache-maui-workloads
        uses: actions/cache@v3
        env:
          cache-name: cache-dotnet-maui-ios-workloads
          hash: ${{ hashFiles('**/${{ vars.DOTNET_VERSION }}/package.deps.json') }}
        with:
          path: /Users/runner/.dotnet/sdk/${{ vars.DOTNET_VERSION }}
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ env.hash }}
          restore-keys:
            ${{ runner.os }}-build-${{ env.cache-name }}-${{ env.hash }}
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Setup .NET SDK
        if: ${{ steps.cache-maui-workloads.outputs.cache-hit != 'true' }}
        uses: actions/setup-dotnet@v3.1.0
        with:
          dotnet-version: ${{ vars.DOTNET_VERSION }}

      - name: Install .NET MAUI workloads
        if: ${{ steps.cache-maui-workloads.outputs.cache-hit != 'true' }}
        run: |
          dotnet workload install maui maui-ios

      - name: .NET release build for iOS (${{ inputs.environment }})
        run: |
          dotnet publish $PROJPATH \
            --framework net7.0-ios \
            --configuration Release \
            -p:DeploymentEnvironment=${{ vars.ENV_NAME }} \
            -p:CodesignKey=${{ secrets.IOS_BUILD_CERTIFICATE_NAME }} \
            -p:CodesignProvision=${{ secrets.IOS_CODE_SIGN_PROVISION_PROFILE_NAME }} \
            -p:UseAppSettings=true \
            -p:Oidc_AuthenticationDomain=${{ vars.AUTHENTICATION_DOMAIN }} \
            -p:Oidc_ClientId=${{ vars.KEYCLOAK_CLIENT_ID }} \
            -p:Oidc_RedirectUri=${{ vars.REDIRECT_URI }} \
            -p:Api_HttpsApiDomain=${{ vars.API_BASE_URL }}

      - name: Upload IPA archive (${{ inputs.environment }})
        uses: actions/upload-artifact@v3.1.2
        with:
          name: MCFD-Mobility-${{ inputs.environment }}
          path: ${{ env.PROJPATH }}/bin/Release/net7.0-ios/ios-arm64/publish/*.ipa
