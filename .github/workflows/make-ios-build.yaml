name: Build iOS release package

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to build package for'
        type: environment
        required: true
      
jobs:

  build-ios-package:
    name: Building, archiving and uploading IPA to GitHub
    runs-on: macOS-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 200
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Import code-signing certificates
        uses: Apple-Actions/import-codesign-certs@v1
        with: 
          p12-file-base64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.IOS_BUILD_CERTIFICATE_PASSWORD }}

      - name: Install provisioning profile
        env:
          IOS_BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision

          echo -n "$IOS_BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          # apply provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: .NET release build for iOS
        run: |
          dotnet publish visitz/Visitz \
            --framework net7.0-ios \
            --configuration Release \
            -p:DeploymentEnvironment=${{ vars.ENV_NAME }} \
            -p:CodesignKey=${{ secrets.IOS_BUILD_CERTIFICATE_NAME }} \
            -p:CodesignProvision=${{ secrets.IOS_CODE_SIGN_PROVISION_PROFILE_NAME }} \
            -p:UseAppSettings=true \
            -p:Oidc_AuthenticationDomain=${{ vars.AUTHENTICATION_DOMAIN }} \
            -p:Oidc_ClientId=${{ vars.KEYCLOAK_CLIENT_ID }} \
            -p:Oidc_RedirectUri=${{ vars.REDIRECT_URI }} \
            -p:Api_HttpsApiDomain=${{ vars.API_BASE_URL }}

      - name: Upload IPA archive
        uses: actions/upload-artifact@v3.1.2
        with:
          name: McfdMobility.ipa
          path: visitz/Visitz/bin/Release/net7.0-ios/ios-arm64/publish/*.ipa

      - name: Clean up keychain and provisioning profile
        if: ${{ always() }}
        
        # This isn't necessary when using GH hosted runners. It's included in case this action is 
        # copied to a self-hosted runner.
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db
          rm ~/Library/MobileDevice/Provisioning\ Profiles/build_pp.mobileprovision
